name: Downloadable offline evaluation demo

on:
  push:
    branches: [main]
    paths:
      - "evalforge/**"
      - "pyproject.toml"
      - "examples/reproduce_offline_benchmark.py"
      - ".github/workflows/offline-evidence-demo.yml"
  pull_request:
    paths:
      - "evalforge/**"
      - "pyproject.toml"
      - "examples/reproduce_offline_benchmark.py"
      - ".github/workflows/offline-evidence-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package as a developer would
        run: python -m pip install .
      - name: Generate reproducible fixture evaluation and comparison
        run: |
          mkdir -p demo-evidence
          evalforge-demo --json --output demo-evidence/baseline.json
          evalforge-demo --json --output demo-evidence/candidate.json
          evalforge-validate demo-evidence/baseline.json
          evalforge-validate demo-evidence/candidate.json
          evalforge-compare-artifacts demo-evidence/baseline.json demo-evidence/candidate.json --output demo-evidence/comparison.json
      - name: Verify evidence and publish measured fixture summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path("demo-evidence")
          baseline = json.loads((folder / "baseline.json").read_text())
          candidate = json.loads((folder / "candidate.json").read_text())
          comparison = json.loads((folder / "comparison.json").read_text())
          if baseline != candidate:
              raise SystemExit("Repeated bundled-fixture evaluation is not deterministic")
          if comparison["bm25_regression_cutoffs"]:
              raise SystemExit("Identical runs unexpectedly regressed")
          rates = baseline["bm25"]["lexical_evidence_hit_rate_by_k"]
          lines = [
              "## EvalForge: reproducible offline demo",
              "",
              "These are measured **bundled, hand-authored lexical retrieval fixtures**,",
              "not an independent SciFact benchmark or LLM safety evaluation.",
              "",
              "| Retrieval cutoff | BM25 lexical evidence hit rate |",
              "| --- | ---: |",
          ]
          for k in ("1", "3", "5"):
              value = rates[k]
              if value is not None and (type(value) not in (float, int) or not 0 <= value <= 1):
                  raise SystemExit(f"Invalid BM25 hit rate at k={k}: {value}")
              lines.append(f"| {k} | {'undefined' if value is None else f'{value:.3f}'} |")
          lines.extend([
              "",
              "Download the `offline-evaluation-evidence` artifact for the baseline,",
              "candidate, and machine-readable comparison report.",
          ])
          summary = "\n".join(lines) + "\n"
          (folder / "README.md").write_text(summary)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write(summary)
          PY
      - name: Verify installed regression and absolute-quality gates
        run: python examples/reproduce_offline_benchmark.py
      - name: Upload developer-facing demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation-evidence
          path: demo-evidence/
          if-no-files-found: warn
          retention-days: 14
