name: Installed wheel smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wheel-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distributable wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel outside source tree
        run: |
          mkdir -p /tmp/evalforge-wheel-smoke
          python -m venv /tmp/evalforge-wheel-smoke/venv
          /tmp/evalforge-wheel-smoke/venv/bin/python -m pip install dist/*.whl
      - name: Verify packaged data and installed CLI
        working-directory: /tmp/evalforge-wheel-smoke
        run: |
          VENV=/tmp/evalforge-wheel-smoke/venv
          "$VENV/bin/python" - <<'PY'
          from importlib.resources import files
          from importlib.metadata import distribution
          pkg = distribution("evalforge-ai")
          scripts = {e.name for e in pkg.entry_points if e.group == "console_scripts"}
          required = {"evalforge-demo", "evalforge-bm25", "evalforge-validate", "evalforge-dataset-audit", "evalforge-custom-gate"}
          assert required <= scripts, required - scripts
          data = files("evalforge").joinpath("data")
          assert data.is_dir()
          assert list(data.glob("*.json")), "No bundled JSON datasets in installed wheel"
          PY
          "$VENV/bin/evalforge-demo" --help
          "$VENV/bin/evalforge-bm25" --help
          "$VENV/bin/evalforge-dataset-audit" --help
          "$VENV/bin/evalforge-custom-gate" --help
