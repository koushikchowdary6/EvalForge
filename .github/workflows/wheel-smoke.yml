name: Installed wheel smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wheel-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distributable wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m build --sdist
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Install wheel outside source tree
        run: |
          mkdir -p /tmp/evalforge-wheel-smoke
          python -m venv /tmp/evalforge-wheel-smoke/venv
          /tmp/evalforge-wheel-smoke/venv/bin/python -m pip install dist/*.whl
      - name: Verify packaged data and installed CLI
        working-directory: /tmp/evalforge-wheel-smoke
        run: |
          VENV=/tmp/evalforge-wheel-smoke/venv
          "$VENV/bin/python" - <<'PY'
          from importlib.resources import files
          from importlib.metadata import distribution
          pkg = distribution("evalforge-ai")
          scripts = {e.name for e in pkg.entry_points if e.group == "console_scripts"}
          required = {
              "evalforge-bm25", "evalforge-import-beir", "evalforge-benchmark-beir",
              "evalforge-run-scifact", "evalforge-compare-beir",
              "evalforge-compare-lexical", "evalforge-demo", "evalforge-validate",
              "evalforge-compare-artifacts", "evalforge-report-md",
              "evalforge-dataset-audit", "evalforge-custom-gate",
              "evalforge-custom-summary", "evalforge-verify-evidence",
          }
          assert required <= scripts, required - scripts
          data = files("evalforge").joinpath("data")
          assert data.is_dir()
          assert list(data.glob("*.json")), "No bundled JSON datasets in installed wheel"
          PY
          # Exercise every published entry point from the isolated wheel, not
          # just a hand-picked subset. A broken import or missing dependency
          # must block the distributable before it is uploaded.
          "$VENV/bin/python" - <<'PY'
          import subprocess
          from importlib.metadata import distribution
          from pathlib import Path

          bin_dir = Path("/tmp/evalforge-wheel-smoke/venv/bin")
          scripts = sorted(
              entry.name for entry in distribution("evalforge-ai").entry_points
              if entry.group == "console_scripts" and entry.name.startswith("evalforge-")
          )
          assert scripts, "No EvalForge console scripts installed"
          for name in scripts:
              command = bin_dir / name
              assert command.is_file(), f"Missing installed command: {name}"
              result = subprocess.run(
                  [str(command), "--help"], capture_output=True, text=True,
                  timeout=30, check=False,
              )
              assert result.returncode == 0, (
                  f"{name} --help exited {result.returncode}: {result.stderr}"
              )
              assert "usage:" in result.stdout.lower(), (
                  f"{name} --help produced no usage text"
              )
          print(f"Verified {len(scripts)} installed EvalForge CLI entry points")
          PY

      - name: Verify installed SciFact runner CLI contract
        working-directory: /tmp/evalforge-wheel-smoke
        run: |
          VENV=/tmp/evalforge-wheel-smoke/venv
          "$VENV/bin/python" - <<'PY'
          import subprocess
          from pathlib import Path

          command = Path("/tmp/evalforge-wheel-smoke/venv/bin/evalforge-run-scifact")
          assert command.is_file(), "SciFact console entry point missing from installed wheel"
          help_result = subprocess.run(
              [str(command), "--help"], capture_output=True, text=True, check=True
          )
          required = (
              "--dataset", "--output-dir", "--evalforge-revision",
              "--source-url", "--download-date", "--max-drop",
              "--timeout-seconds",
          )
          missing = [flag for flag in required if flag not in help_result.stdout]
          assert not missing, f"SciFact CLI missing documented options: {missing}"

          invalid = subprocess.run(
              [str(command), "--dataset", "/does-not-exist",
               "--output-dir", "/does-not-exist", "--evalforge-revision", "smoke",
               "--source-url", "https://example.org", "--download-date", "2026-11-20",
               "--max-drop", "nan"],
              capture_output=True, text=True
          )
          assert invalid.returncode == 2, invalid.stderr
          assert "--max-drop must be a finite number" in invalid.stderr, invalid.stderr
          PY

      - name: Run installed offline demo and validate its artifact
        working-directory: /tmp/evalforge-wheel-smoke
        run: |
          VENV=/tmp/evalforge-wheel-smoke/venv
          "$VENV/bin/evalforge-demo" --json --output /tmp/evalforge-wheel-smoke/evaluation.json
          "$VENV/bin/evalforge-validate" /tmp/evalforge-wheel-smoke/evaluation.json --min-hit-rate 0.50

      - name: Exercise installed SciFact pipeline with synthetic BEIR data
        working-directory: /tmp/evalforge-wheel-smoke
        run: |
          VENV=/tmp/evalforge-wheel-smoke/venv
          "$VENV/bin/python" - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path("/tmp/evalforge-wheel-smoke")
          dataset = root / "synthetic-beir"
          (dataset / "qrels").mkdir(parents=True, exist_ok=True)
          (dataset / "corpus.jsonl").write_text(
              '{"_id":"d1","title":"Astronomy","text":"Mars moons Phobos Deimos"}\n'
              '{"_id":"d2","title":"Botany","text":"Plants need sunlight for photosynthesis"}\n',
              encoding="utf-8",
          )
          (dataset / "queries.jsonl").write_text(
              '{"_id":"q1","text":"Mars moons"}\n'
              '{"_id":"q2","text":"photosynthesis sunlight"}\n',
              encoding="utf-8",
          )
          (dataset / "qrels" / "test.tsv").write_text(
              "query-id\tcorpus-id\tscore\nq1\td1\t1\nq2\td2\t1\n",
              encoding="utf-8",
          )
          evidence = root / "synthetic-scifact-evidence"
          evidence.mkdir()
          bin_dir = root / "venv" / "bin"
          command = [
              str(bin_dir / "evalforge-run-scifact"),
              "--dataset", str(dataset), "--output-dir", str(evidence),
              "--evalforge-revision", "installed-wheel-smoke",
              "--source-url", "https://example.org/synthetic-fixture",
              "--download-date", "2026-11-21", "--max-drop", "0.02",
          ]
          subprocess.run(command, check=True, timeout=90)
          subprocess.run([
              str(bin_dir / "evalforge-verify-scifact"), str(evidence),
              "--dataset", str(dataset),
          ], check=True, timeout=30)
          manifest = json.loads((evidence / "manifest.json").read_text())
          expected = {
              key: hashlib.sha256((dataset / file).read_bytes()).hexdigest()
              for key, file in {
                  "corpus": "corpus.jsonl", "queries": "queries.jsonl",
                  "qrels": "qrels/test.tsv",
              }.items()
          }
          assert manifest["input_sha256"] == expected
          assert all((evidence / f"scifact-{name}.json").is_file()
                     for name in ("ascii", "unicode", "comparison"))
          print("Installed wheel executed and verified synthetic BEIR evidence")
          PY

      - name: Install source distribution and verify entry points
        working-directory: /tmp/evalforge-wheel-smoke
        run: |
          python -m venv /tmp/evalforge-wheel-smoke/sdist-venv
          /tmp/evalforge-wheel-smoke/sdist-venv/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          /tmp/evalforge-wheel-smoke/sdist-venv/bin/python - <<'PY'
          from importlib.metadata import distribution
          from importlib.resources import files
          package = distribution("evalforge-ai")
          scripts = {entry.name for entry in package.entry_points if entry.group == "console_scripts"}
          required = {"evalforge-benchmark-beir", "evalforge-import-beir", "evalforge-custom-gate"}
          assert required <= scripts, required - scripts
          assert list(files("evalforge").joinpath("data").glob("*.json"))
          PY
          /tmp/evalforge-wheel-smoke/sdist-venv/bin/evalforge-benchmark-beir --help

      - name: Upload verified distribution artifacts
        if: success() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: evalforge-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
