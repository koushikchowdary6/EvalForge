name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Preserve results from every supported Python version when one fails.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install offline CLI package and verify bundled fixtures
      if: matrix.python-version == '3.12'
      run: |
        python -m pip install .
        evalforge-bm25 --k 1 3 5 --summary-only > installed-cli-summary.json
        python - <<'PY'
        import json
        from pathlib import Path
        report = json.loads(Path("installed-cli-summary.json").read_text())
        assert report["method"] == "lexical_bm25_retrieval_only"
        assert report["corpus_size"] == 15
        assert report["question_count"] == 14
        assert set(report["by_top_k"]) == {"1", "3", "5"}
        PY

    # Packaging compatibility is part of the supported Python 3.10–3.12 contract,
    # not just a Python 3.12 smoke test. Exercise the wheel in an isolated venv
    # on every matrix version; publish the artifact only from Python 3.12.
    - name: Verify wheel installation outside the source checkout
      run: |
        python -m pip wheel --no-deps --wheel-dir dist .
        python -m venv "$RUNNER_TEMP/evalforge-wheel-venv"
        "$RUNNER_TEMP/evalforge-wheel-venv/bin/python" -m pip install dist/evalforge_ai-*.whl
        # Check the isolated installation, not just the runner's development environment.
        "$RUNNER_TEMP/evalforge-wheel-venv/bin/python" -m pip check
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/evalforge-wheel-venv/bin/evalforge-bm25" --k 1 3 5 --summary-only > wheel-summary.json
        "$RUNNER_TEMP/evalforge-wheel-venv/bin/python" - <<'PY'
        import json
        from pathlib import Path
        report = json.loads(Path("wheel-summary.json").read_text(encoding="utf-8"))
        assert report["method"] == "lexical_bm25_retrieval_only"
        assert report["corpus_size"] == 15
        assert report["question_count"] == 14
        assert set(report["by_top_k"]) == {"1", "3", "5"}
        PY
        "$RUNNER_TEMP/evalforge-wheel-venv/bin/evalforge-compare-lexical" --k 1 3 5 > paired-lexical.json
        # Test the installed entry point with caller-supplied datasets, not just
        # the package's bundled fixtures. Run outside the source checkout.
        "$RUNNER_TEMP/evalforge-wheel-venv/bin/evalforge-bm25" \
          --corpus "$GITHUB_WORKSPACE/datasets/multilingual_lexical_corpus.json" \
          --questions "$GITHUB_WORKSPACE/datasets/multilingual_lexical_questions.json" \
          --tokenizer unicode --k 1 --summary-only > custom-fixture-summary.json
        "$RUNNER_TEMP/evalforge-wheel-venv/bin/python" - <<'PY'
        import json
        from pathlib import Path
        report = json.loads(Path("custom-fixture-summary.json").read_text(encoding="utf-8"))
        assert report["method"] == "lexical_bm25_retrieval_only"
        assert report["question_count"] == 6
        assert report["parameters"]["tokenizer"] == "unicode_alphanumeric"
        assert set(report["by_top_k"]) == {"1"}
        assert len(report["corpus_sha256"]) == 64
        assert len(report["questions_sha256"]) == 64
        PY
        "$RUNNER_TEMP/evalforge-wheel-venv/bin/python" - <<'PY'
        import json
        from pathlib import Path
        report = json.loads(Path("paired-lexical.json").read_text(encoding="utf-8"))
        assert report["method"] == "paired_ascii_unicode_bm25_lexical_retrieval_only"
        assert report["question_count"] == 6
        assert set(report["by_top_k"]) == {"1", "3", "5"}
        assert len(report["corpus_sha256"]) == 64
        assert len(report["questions_sha256"]) == 64
        PY

    # Exercise the source distribution separately: wheel-only tests cannot catch
    # files omitted from an sdist that downstream packagers need to rebuild.
    - name: Verify source distribution rebuild and offline CLI
      if: matrix.python-version == '3.12'
      run: |
        python -m pip install 'build>=1,<2'
        python -m build --sdist --outdir sdist .
        python -m venv "$RUNNER_TEMP/evalforge-sdist-venv"
        "$RUNNER_TEMP/evalforge-sdist-venv/bin/python" -m pip install sdist/evalforge_ai-*.tar.gz
        "$RUNNER_TEMP/evalforge-sdist-venv/bin/python" -m pip check
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/evalforge-sdist-venv/bin/evalforge-bm25" --k 1 3 5 --summary-only > sdist-summary.json
        "$RUNNER_TEMP/evalforge-sdist-venv/bin/evalforge-compare-lexical" --k 1 3 5 > sdist-paired.json
        "$RUNNER_TEMP/evalforge-sdist-venv/bin/python" - <<'PY'
        import json
        from pathlib import Path
        bm25 = json.loads(Path("sdist-summary.json").read_text(encoding="utf-8"))
        paired = json.loads(Path("sdist-paired.json").read_text(encoding="utf-8"))
        assert bm25["method"] == "lexical_bm25_retrieval_only"
        assert bm25["corpus_size"] == 15 and bm25["question_count"] == 14
        assert paired["method"] == "paired_ascii_unicode_bm25_lexical_retrieval_only"
        assert paired["question_count"] == 6
        assert all(len(report[key]) == 64 for report in (bm25, paired)
                   for key in ("corpus_sha256", "questions_sha256"))
        PY

    - name: Verify compact paired comparison retains all aggregate evidence
      if: matrix.python-version == '3.12'
      run: |
        python -m evalforge.compare_lexical_baselines --k 1 3 5 > paired-full.json
        python -m evalforge.compare_lexical_baselines --k 1 3 5 --summary-only > paired-summary.json
        python - <<'PY'
        import json
        from pathlib import Path
        full = json.loads(Path("paired-full.json").read_text(encoding="utf-8"))
        compact = json.loads(Path("paired-summary.json").read_text(encoding="utf-8"))
        assert "cases" in full and "cases" not in compact
        assert {k: v for k, v in full.items() if k != "cases"} == compact
        assert compact["question_count"] == 6
        assert set(compact["by_top_k"]) == {"1", "3", "5"}
        assert all(len(compact[key]) == 64 for key in ("corpus_sha256", "questions_sha256"))
        PY

    - name: Verify paired CLI export and overwrite protection
      if: matrix.python-version == '3.12'
      run: |
        python -m evalforge.compare_lexical_baselines --k 1 3 5 --summary-only > paired-stdout.json
        python -m evalforge.compare_lexical_baselines --k 1 3 5 --summary-only --output paired-export.json
        python - <<'PY'
        import json
        from pathlib import Path
        expected = json.loads(Path("paired-stdout.json").read_text(encoding="utf-8"))
        actual = json.loads(Path("paired-export.json").read_text(encoding="utf-8"))
        assert expected == actual
        assert actual["question_count"] == 6
        assert len(actual["corpus_sha256"]) == 64
        PY
        if python -m evalforge.compare_lexical_baselines --summary-only --output paired-export.json; then
          echo "ERROR: paired CLI overwrote existing evidence" >&2
          exit 1
        fi
        cmp paired-stdout.json paired-export.json

    - name: Verify installed dependency consistency
      run: python -m pip check

    - name: Run unit tests (no API calls)
      run: |
        python -m pytest tests/ -v -m "not api"

    - name: Generate and validate multilingual BM25 comparison evidence
      if: matrix.python-version == '3.12'
      run: |
        python -m evalforge.offline_rag_demo --corpus datasets/multilingual_lexical_corpus.json --questions datasets/multilingual_lexical_questions.json --tokenizer ascii --k 1 > multilingual-ascii.json
        python -m evalforge.offline_rag_demo --corpus datasets/multilingual_lexical_corpus.json --questions datasets/multilingual_lexical_questions.json --tokenizer unicode --k 1 > multilingual-unicode.json
        python - <<'PY'
        import json
        from pathlib import Path
        ascii_report = json.loads(Path("multilingual-ascii.json").read_text())
        unicode_report = json.loads(Path("multilingual-unicode.json").read_text())
        assert ascii_report["method"] == unicode_report["method"] == "lexical_bm25_retrieval_only"
        assert ascii_report["parameters"]["tokenizer"] == "ascii_alphanumeric"
        assert unicode_report["parameters"]["tokenizer"] == "unicode_alphanumeric"
        assert ascii_report["corpus_sha256"] == unicode_report["corpus_sha256"]
        assert ascii_report["questions_sha256"] == unicode_report["questions_sha256"]
        assert ascii_report["question_count"] == unicode_report["question_count"] == 6
        assert ascii_report["selected_tokenizer_diagnostics"]["questions_without_selected_tokens"] == 4
        assert unicode_report["selected_tokenizer_diagnostics"]["questions_without_selected_tokens"] == 0
        assert unicode_report["by_top_k"]["1"]["lexical_evidence_hit_rate"] == 1.0
        PY

    - name: Verify compact benchmark artifact preserves reproducibility
      if: matrix.python-version == '3.12'
      run: |
        python -m evalforge.offline_rag_demo --k 1 3 5 > benchmark-full.json
        python -m evalforge.offline_rag_demo --k 1 3 5 --summary-only > benchmark-summary.json
        python - <<'PY'
        import json
        from pathlib import Path
        full = json.loads(Path("benchmark-full.json").read_text())
        compact = json.loads(Path("benchmark-summary.json").read_text())
        assert "cases" in full and "cases" not in compact
        assert {k: v for k, v in full.items() if k != "cases"} == compact
        assert len(compact["corpus_sha256"]) == 64
        assert len(compact["questions_sha256"]) == 64
        assert set(compact["by_top_k"]) == {"1", "3", "5"}
        PY

    - name: Verify CLI file export matches stdout and protects existing reports
      if: matrix.python-version == '3.12'
      run: |
        python -m evalforge.offline_rag_demo --k 1 3 5 --summary-only --output exported-summary.json
        python - <<'PY'
        import json
        from pathlib import Path
        expected = json.loads(Path("benchmark-summary.json").read_text(encoding="utf-8"))
        actual = json.loads(Path("exported-summary.json").read_text(encoding="utf-8"))
        assert actual == expected, "File export changed benchmark metrics or provenance"
        PY
        if python -m evalforge.offline_rag_demo --k 1 3 5 --summary-only --output exported-summary.json; then
          echo "ERROR: CLI overwrote an existing benchmark artifact" >&2
          exit 1
        fi
        python - <<'PY'
        import json
        from pathlib import Path
        expected = json.loads(Path("benchmark-summary.json").read_text(encoding="utf-8"))
        actual = json.loads(Path("exported-summary.json").read_text(encoding="utf-8"))
        assert actual == expected, "Failed overwrite attempt changed existing evidence"
        PY

    - name: Upload compact benchmark evidence
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: offline-bm25-summary
        path: benchmark-summary.json
        if-no-files-found: error
        retention-days: 30

    - name: Upload multilingual BM25 evidence
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: multilingual-bm25-evidence
        path: |
          multilingual-ascii.json
          multilingual-unicode.json
        if-no-files-found: error
        retention-days: 30

    # Only publish the distributable after the complete Python 3.12 test and
    # benchmark-evidence checks pass; failed jobs must not expose a wheel
    # labeled as verified.
    - name: Upload verified offline CLI wheel
      if: success() && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: evalforge-offline-cli-wheel
        path: dist/evalforge_ai-*.whl
        if-no-files-found: error
        retention-days: 30

    # The source archive has already been rebuilt and installed in a clean
    # environment above. Publish it alongside the wheel so downstream users
    # can reproduce installation without relying on the Git checkout.
    - name: Upload verified offline CLI source distribution
      if: success() && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: evalforge-offline-cli-sdist
        path: sdist/evalforge_ai-*.tar.gz
        if-no-files-found: error
        retention-days: 30
