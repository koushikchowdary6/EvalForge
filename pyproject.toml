[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge-ai"
version = "0.1.0"
description = "Reproducible AI evaluation and offline lexical RAG retrieval baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0,<2"]
keywords = ["rag", "retrieval-evaluation", "llm-evaluation", "bm25", "ai-evaluation", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/koushikchowdary6/EvalForge"
Source = "https://github.com/koushikchowdary6/EvalForge"
Issues = "https://github.com/koushikchowdary6/EvalForge/issues"

[project.scripts]
evalforge-bm25 = "evalforge.offline_rag_demo:main"
evalforge-compare-lexical = "evalforge.compare_lexical_baselines:main"
evalforge-demo = "evalforge.demo:main"
evalforge-validate = "evalforge.artifact_validation:main"
evalforge-compare-artifacts = "evalforge.compare_artifacts:main"
evalforge-report-md = "evalforge.report_markdown:main"
evalforge-dataset-audit = "evalforge.dataset_audit:main"
evalforge-custom-gate = "evalforge.custom_gate:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
providers = ["python-dotenv==1.2.2", "openai==2.53.0", "anthropic==0.121.0"]

[tool.setuptools.packages.find]
include = ["evalforge*"]

[tool.setuptools.package-data]
evalforge = ["data/*.json"]
