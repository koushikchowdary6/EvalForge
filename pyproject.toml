[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge-ai"
version = "0.1.0"
description = "Reproducible AI evaluation and offline lexical RAG retrieval baselines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
evalforge-bm25 = "evalforge.offline_rag_demo:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
providers = ["python-dotenv==1.2.2", "openai==2.53.0", "anthropic==0.121.0"]

[tool.setuptools.packages.find]
include = ["evalforge*"]

[tool.setuptools.package-data]
evalforge = ["data/*.json"]
